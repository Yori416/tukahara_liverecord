<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塚原大地 推し活ログ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex justify-center">
    <div class="w-full max-w-2xl border-x border-gray-800 min-h-screen flex flex-col">
        <!-- Header -->
        <header class="sticky top-0 bg-[#0d1117]/80 backdrop-blur-md border-b border-gray-800 px-4 py-3 flex items-center justify-between z-10">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-chart-line text-blue-400"></i> 塚原大地 配信動態追蹤
            </h1>
            <span id="status-badge" class="text-xs px-2.5 py-1 rounded-full font-bold bg-gray-800 text-gray-400">讀取中...</span>
        </header>

        <!-- Profile Section -->
        <div id="profile-section" class="p-4 border-b border-gray-800 flex items-center gap-4 bg-gray-900/40">
            <div class="w-16 h-16 rounded-full bg-gray-700 overflow-hidden flex-shrink-0 border border-gray-700">
                <img id="channel-icon" src="https://yt3.googleusercontent.com/ytc/AIdro_n...=s900-c-k-c0x00ffffff-no-rj" alt="Avatar" class="w-full h-full object-cover">
            </div>
            <div>
                <h2 id="channel-name" class="font-bold text-lg">塚原大地 / Tsukahara Daichi</h2>
                <p id="channel-handle" class="text-sm text-gray-400">@TsukaharaDaichi_Y4T4</p>
                <p id="channel-desc" class="text-xs text-gray-300 mt-1">FPSとTCGが好きで、歌ったりもするゲーマーです。</p>
            </div>
        </div>

        <!-- Timeline / Stream List -->
        <main id="stream-container" class="flex-1 divide-y divide-gray-800">
            <div class="p-8 text-center text-gray-500">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p>正在載入最新動態...</p>
            </div>
        </main>
    </div>

    <script>
        async function loadData() {
            try {
                // 讀取由 GitHub Actions 自動生成的 data.json
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('找不到資料');
                const data = await response.json();

                // 更新個人檔案
                if (data.channel) {
                    if(data.channel.icon) document.getElementById('channel-icon').src = data.channel.icon;
                    if(data.channel.name) document.getElementById('channel-name').innerText = data.channel.name;
                    if(data.channel.handle) document.getElementById('channel-handle').innerText = data.channel.handle;
                }

                // 渲染動態串流
                const container = document.getElementById('stream-container');
                container.innerHTML = '';
                
                let isLiveNow = false;

                data.streams.forEach(stream => {
                    if (stream.type === 'live') isLiveNow = true;

                    const card = document.createElement('article');
                    card.className = "p-4 hover:bg-gray-900/50 transition cursor-pointer flex flex-col gap-3";
                    card.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full overflow-hidden bg-gray-700 flex-shrink-0">
                                <img src="${data.channel ? data.channel.icon : ''}" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="font-bold text-sm">塚原大地</span>
                                    <span class="text-xs text-gray-500">@TsukaharaDaichi_Y4T4</span>
                                    <span class="text-xs text-gray-500">· ${stream.published_at}</span>
                                </div>
                                ${stream.type === 'live' ? '<span class="inline-block mt-0.5 text-[10px] bg-red-600 text-white px-2 py-0.5 rounded-full font-bold animate-pulse">🔴 配信中 (Live)</span>' : ''}
                            </div>
                        </div>
                        <div class="pl-13">
                            <p class="text-sm font-medium mb-2">${stream.title}</p>
                            <a href="https://www.youtube.com/watch?v=${stream.video_id}" target="_blank" class="block rounded-xl overflow-hidden border border-gray-800 relative group">
                                <img src="${stream.thumbnail}" class="w-full aspect-video object-cover group-hover:scale-105 transition duration-300">
                                <div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                    <div class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center text-white shadow-lg">
                                        <i class="fa-solid fa-play ml-0.5"></i>
                                    </div>
                                </div>
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });

                // 更新頂部標籤狀態
                const badge = document.getElementById('status-badge');
                if (isLiveNow) {
                    badge.className = "text-xs px-2.5 py-1 rounded-full font-bold bg-red-500/20 text-red-400 border border-red-500/30 animate-pulse";
                    badge.innerText = "🔴 直播中";
                } else {
                    badge.className = "text-xs px-2.5 py-1 rounded-full font-bold bg-green-500/20 text-green-400 border border-green-500/30";
                    badge.innerText = "🟢 待機/近期影片";
                }

            } catch (err) {
                console.error(err);
                document.getElementById('stream-container').innerHTML = `
                    <div class="p-8 text-center text-gray-400">
                        <p class="mb-2">⚠️ 尚未偵測到資料檔 (data.json)</p>
                        <p class="text-xs text-gray-500">請確認 GitHub Actions 是否已執行並成功生成數據。</p>
                    </div>
                `;
            }
        }
        loadData();
    </script>
</body>
</html>
