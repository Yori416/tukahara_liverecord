<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塚原大地 - 個人推し活 Dashboard & Calendar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #090d16; color: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex text-sm">

    <!-- 1. 左側導覽列 (Sidebar) -->
    <aside class="w-64 border-r border-gray-800 p-4 flex flex-col justify-between hidden md:flex sticky top-0 h-screen bg-[#0d1117]">
        <div class="space-y-6">
            <div class="flex items-center gap-3 px-2">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-white text-lg">Y</div>
                <span class="font-bold text-base tracking-wide">Y4T4 Tracker</span>
            </div>

            <nav class="space-y-1 font-medium">
                <button onclick="switchTab('feed')" id="btn-feed" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-blue-600/20 text-blue-400 font-bold transition">
                    <i class="fa-solid fa-house w-5"></i> 配信 TL (Timeline)
                </button>
                <button onclick="switchTab('calendar')" id="btn-calendar" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:bg-gray-800/60 transition">
                    <i class="fa-solid fa-calendar-days w-5"></i> 推し活日曆 (Schedule)
                </button>
                <button onclick="switchTab('grid')" id="btn-grid" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:bg-gray-800/60 transition">
                    <i class="fa-solid fa-border-all w-5"></i> サムネ一覧 (縮圖牆)
                </button>
            </nav>
        </div>

        <div class="p-3 bg-gray-900/60 border border-gray-800 rounded-xl flex items-center gap-3">
            <div class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></div>
            <span class="text-xs text-gray-400 font-semibold">自動同步運作中</span>
        </div>
    </aside>

    <!-- 2. 中央內容區 -->
    <div class="flex-1 max-w-4xl border-r border-gray-800 min-h-screen flex flex-col">
        
        <!-- 個人 Banner & Profile Header -->
        <div class="relative border-b border-gray-800">
            <div class="h-28 bg-gradient-to-r from-blue-900 via-indigo-950 to-slate-900"></div>
            <div class="px-6 pb-4 flex justify-between items-end -mt-8 relative">
                <div class="flex items-end gap-4">
                    <img id="channel-icon" src="https://yt3.googleusercontent.com/ytc/AIdro_nN_sXoH6Yf8L0X3C2v4gB9T3G_M9_0Q2zN0W1=s900-c-k-c0x00ffffff-no-rj" class="w-20 h-20 rounded-full border-4 border-[#090d16] bg-gray-800 object-cover">
                    <div class="mb-1">
                        <h1 id="channel-name" class="text-lg font-bold flex items-center gap-2">塚原大地 / Tsukahara Daichi</h1>
                        <p id="channel-handle" class="text-xs text-gray-400">@TsukaharaDaichi_Y4T4</p>
                    </div>
                </div>
                <a href="https://youtube.com/@tsukaharadaichi_y4t4" target="_blank" class="px-4 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-full font-bold text-xs transition flex items-center gap-1.5">
                    <i class="fa-brands fa-youtube"></i> YouTube
                </a>
            </div>
            <p id="channel-desc" class="px-6 pb-4 text-xs text-gray-300">FPSとTCGが好きで、歌ったりもするゲーマーです。</p>
        </div>

        <!-- View 1: Timeline -->
        <main id="view-feed" class="flex-1 divide-y divide-gray-800/60"></main>

        <!-- View 2: 🗓️ 推し活日曆 (Schedule Calendar) -->
        <main id="view-calendar" class="flex-1 p-6 hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-calendar-check text-blue-400"></i> 開台與活動日曆
                </h2>
                <span class="text-xs text-gray-400">點擊日期查看當日 Live</span>
            </div>
            <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-4 mb-6">
                <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-gray-500 mb-2">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div id="calendar-days" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
            </div>
            <!-- 選取日期的詳細結果 -->
            <div id="selected-date-title" class="font-bold text-sm mb-3 text-blue-400">所有活動紀錄</div>
            <div id="selected-date-container" class="space-y-3"></div>
        </main>

        <!-- View 3: 縮圖牆 -->
        <main id="view-grid" class="flex-1 p-4 grid grid-cols-2 md:grid-cols-3 gap-4 hidden"></main>
    </div>

    <script>
        let currentData = null;

        async function init() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                currentData = await res.json();

                // 強制套用官方頭像與資料
                document.getElementById('channel-icon').src = "https://yt3.googleusercontent.com/ytc/AIdro_nN_sXoH6Yf8L0X3C2v4gB9T3G_M9_0Q2zN0W1=s900-c-k-c0x00ffffff-no-rj";
                document.getElementById('channel-name').innerText = "塚原大地 / Tsukahara Daichi【にじさんじ】";
                document.getElementById('channel-handle').innerText = "@TsukaharaDaichi_Y4T4";
                document.getElementById('channel-desc').innerText = "FPSとTCGが好きで、歌ったりもするゲーマーです。";

                renderFeed(currentData.streams);
                renderGrid();
                buildCalendar();
                
            } catch (e) {
                console.error(e);
            }
        }

        function renderFeed(streams) {
            const container = document.getElementById('view-feed');
            container.innerHTML = '';

            if(streams.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-500">該日期無開台紀錄</div>`;
                return;
            }

            streams.forEach(item => {
                const isLive = item.type === 'live';
                const card = document.createElement('article');
                card.className = "p-4 hover:bg-gray-900/40 transition flex gap-3";
                card.innerHTML = `
                    <img src="https://yt3.googleusercontent.com/ytc/AIdro_nN_sXoH6Yf8L0X3C2v4gB9T3G_M9_0Q2zN0W1=s900-c-k-c0x00ffffff-no-rj" class="w-10 h-10 rounded-full flex-shrink-0">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold">塚原大地</span>
                            <span class="text-xs text-gray-500">· ${item.published_at}</span>
                            ${isLive ? '<span class="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full animate-pulse">🔴 LIVE</span>' : ''}
                        </div>
                        <p class="text-sm mb-2.5 font-medium">${item.title}</p>
                        <a href="https://www.youtube.com/watch?v=${item.video_id}" target="_blank" class="block rounded-xl overflow-hidden border border-gray-800/80 relative group">
                            <img src="${item.thumbnail}" class="w-full aspect-video object-cover group-hover:scale-105 transition duration-300">
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderGrid() {
            const container = document.getElementById('view-grid');
            container.innerHTML = '';

            currentData.streams.forEach(item => {
                const card = document.createElement('a');
                card.href = `https://www.youtube.com/watch?v=${item.video_id}`;
                card.target = "_blank";
                card.className = "block bg-gray-900/60 rounded-xl overflow-hidden border border-gray-800 hover:border-blue-500/50 transition group";
                card.innerHTML = `
                    <div class="aspect-video overflow-hidden relative">
                        <img src="${item.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-2.5">
                        <p class="text-xs font-semibold line-clamp-2">${item.title}</p>
                        <p class="text-[10px] text-gray-500 mt-1">${item.published_at}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 🗓️ 建立日曆邏輯
        function buildCalendar() {
            const container = document.getElementById('calendar-days');
            container.innerHTML = '';

            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth();

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // 整理日期資料 Map
            const eventMap = {};
            currentData.streams.forEach(s => {
                if(s.date) {
                    if(!eventMap[s.date]) eventMap[s.date] = [];
                    eventMap[s.date].push(s);
                }
            });

            // 填充空白天數
            for(let i=0; i<firstDay; i++) {
                container.appendChild(document.createElement('div'));
            }

            // 生成當月天數
            for(let day=1; day<=daysInMonth; day++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const hasEvent = eventMap[dateStr];

                const dayCell = document.createElement('button');
                dayCell.className = `h-10 rounded-lg flex flex-col items-center justify-center relative border border-gray-800/40 transition hover:bg-gray-800 ${hasEvent ? 'bg-blue-900/30 text-blue-300 border-blue-500/50 font-bold' : 'text-gray-400'}`;
                dayCell.innerHTML = `
                    <span>${day}</span>
                    ${hasEvent ? '<div class="w-1.5 h-1.5 rounded-full bg-blue-400 mt-0.5"></div>' : ''}
                `;
                dayCell.onclick = () => filterByDate(dateStr, eventMap[dateStr] || []);
                container.appendChild(dayCell);
            }
        }

        function filterByDate(dateStr, events) {
            document.getElementById('selected-date-title').innerText = `${dateStr} 的配信/影片紀錄`;
            const container = document.getElementById('selected-date-container');
            container.innerHTML = '';

            if(events.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-gray-500 bg-gray-900/40 rounded-xl border border-gray-800">這一天沒有開台紀錄</div>`;
                return;
            }

            events.forEach(item => {
                const card = document.createElement('div');
                card.className = "p-3 bg-gray-900/60 border border-gray-800 rounded-xl flex gap-3 items-center";
                card.innerHTML = `
                    <img src="${item.thumbnail}" class="w-24 aspect-video object-cover rounded-lg">
                    <div class="flex-1">
                        <p class="font-bold text-xs line-clamp-1">${item.title}</p>
                        <a href="https://www.youtube.com/watch?v=${item.video_id}" target="_blank" class="inline-block mt-1 text-[11px] text-blue-400 hover:underline">觀看影片 →</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(tab) {
            document.getElementById('view-feed').classList.add('hidden');
            document.getElementById('view-calendar').classList.add('hidden');
            document.getElementById('view-grid').classList.add('hidden');

            document.getElementById('btn-feed').className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:bg-gray-800/60 transition";
            document.getElementById('btn-calendar').className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:bg-gray-800/60 transition";
            document.getElementById('btn-grid').className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:bg-gray-800/60 transition";

            if (tab === 'feed') {
                document.getElementById('view-feed').classList.remove('hidden');
                document.getElementById('btn-feed').className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-blue-600/20 text-blue-400 font-bold transition";
            } else if (tab === 'calendar') {
                document.getElementById('view-calendar').classList.remove('hidden');
                document.getElementById('btn-calendar').className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-blue-600/20 text-blue-400 font-bold transition";
            } else if (tab === 'grid') {
                document.getElementById('view-grid').classList.remove('hidden');
                document.getElementById('btn-grid').className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-xl bg-blue-600/20 text-blue-400 font-bold transition";
            }
        }

        init();
    </script>
</body>
</html>
